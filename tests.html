<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RLA Tests — Rainbow Learning Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { padding: 24px; max-width: 820px; margin: 0 auto; font-family: 'Outfit', sans-serif; }
    h1 { font-size: 1.6rem; font-weight: 900; margin-bottom: 8px; }
    h2 { font-size: 1rem; font-weight: 800; margin: 18px 0 6px; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; }
    #summary { font-family: monospace; font-size: 1.05rem; font-weight: 700; margin: 10px 0 20px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); }
  </style>
</head>
<body>
  <h1>🧪 RLA Test Suite — Rainbow Learning Academy</h1>
  <div id="summary">Running…</div>
  <div id="results"></div>

  <script src="shared.js"></script>
  <script src="logic.js"></script>
  <script>
    let _pass = 0, _fail = 0;

    function assert(got, expected, label) {
      const ok = JSON.stringify(got) === JSON.stringify(expected);
      if (ok) _pass++; else _fail++;
      const row = document.createElement('div');
      row.style.cssText = [
        'padding:6px 10px',
        'border-radius:6px',
        'margin:3px 0',
        'font-family:monospace',
        'font-size:.85rem',
        ok ? 'background:rgba(52,211,153,.12)' : 'background:rgba(248,113,113,.12)',
        ok ? 'color:#34d399' : 'color:#f87171',
        ok ? 'border:1px solid rgba(52,211,153,.25)' : 'border:1px solid rgba(248,113,113,.25)',
      ].join(';');
      row.textContent = (ok ? '✅ PASS' : '❌ FAIL') + ' — ' + label +
        (ok ? '' : ' | got: ' + JSON.stringify(got) + ' expected: ' + JSON.stringify(expected));
      document.getElementById('results').appendChild(row);
    }

    function section(title) {
      const h = document.createElement('h2');
      h.textContent = title;
      document.getElementById('results').appendChild(h);
    }

    function summarize() {
      const total = _pass + _fail;
      const el = document.getElementById('summary');
      el.textContent = _pass + ' / ' + total + ' passed' + (_fail ? ' — ' + _fail + ' FAILED ❌' : ' — All green! ✅');
      el.style.color = _fail ? '#f87171' : '#34d399';
    }

    // ── safeInt ──────────────────────────────────────────────────────
    section('safeInt');
    assert(safeInt('7', 0),    7,   'safeInt parses positive integer');
    assert(safeInt('-12', 0), -12,  'safeInt parses negative integer');
    assert(safeInt('0', 99),   0,   'safeInt parses zero');
    assert(safeInt('abc', 42), 42,  'safeInt returns fallback for NaN string');
    assert(safeInt('', 99),    99,  'safeInt returns fallback for empty string');
    assert(safeInt('3.9', 0),  3,   'safeInt truncates decimal (parseInt behaviour)');

    // ── shuffle ───────────────────────────────────────────────────────
    section('shuffle');
    const original = [1, 2, 3, 4, 5];
    const shuffled = shuffle(original);
    assert(shuffled.length, 5, 'shuffle preserves length');
    assert([...shuffled].sort(function(a, b) { return a - b; }), [1, 2, 3, 4, 5], 'shuffle preserves elements');
    assert(original, [1, 2, 3, 4, 5], 'shuffle does not mutate original array');

    // ── getCharImage ──────────────────────────────────────────────────
    section('getCharImage');
    assert(getCharImage('Scarface Claw'),      'scarface.png',           'getCharImage: Scarface Claw');
    assert(getCharImage('Scarface'),           'scarface.png',           'getCharImage: Scarface (alias)');
    assert(getCharImage('Rainbow Doggy'),      'head.png',               'getCharImage: Rainbow Doggy');
    assert(getCharImage('Hercules Morse'),     'hercules_morse.png',     'getCharImage: Hercules Morse');
    assert(getCharImage('Hairy Maclary'),      'hairy_maclary.png',      'getCharImage: Hairy Maclary');
    assert(getCharImage('Muffin McLay'),       'muffin_mclay.png',       'getCharImage: Muffin McLay');
    assert(getCharImage('Bottomley Potts'),    'bottomley_potts.png',    'getCharImage: Bottomley Potts');
    assert(getCharImage('Kind Dog'),           'kind dog.png',           'getCharImage: Kind Dog');
    assert(getCharImage('Nobody'),             'hairy_maclary.png',      'getCharImage: unknown → fallback');
    assert(getCharImage(''),                   'hairy_maclary.png',      'getCharImage: empty → fallback');

    // ── isMuted ───────────────────────────────────────────────────────
    section('isMuted');
    assert(typeof isMuted(), 'boolean', 'isMuted returns boolean');

    // ── getStars / getStreak ──────────────────────────────────────────
    section('getStars / getStreak');
    assert(typeof getStars(),  'number', 'getStars returns number');
    assert(typeof getStreak(), 'number', 'getStreak returns number');
    assert(getStars()  >= 0,  true,     'getStars is non-negative');
    assert(getStreak() >= 0,  true,     'getStreak is non-negative');

    // ── keypad integer parsing ────────────────────────────────────────
    section('Keypad integer parsing (parseInt behaviour used by makeKeypad)');
    assert(parseInt('12',  10),  12,  'keypad parses 12');
    assert(parseInt('-12', 10), -12,  'keypad parses -12 (negative answer)');
    assert(parseInt('0',   10),   0,  'keypad parses 0');
    assert(parseInt('120', 10), 120,  'keypad parses 120 (max number)');
    assert(isNaN(parseInt('', 10)), true, 'keypad: empty string is NaN (guard before submit)');

    // ── buildNumberRecord spot-checks ────────────────────────────────
    section('buildNumberRecord — spot checks');
    (function() {
      const r6  = buildNumberRecord(6);
      assert(r6.numClass,    'perfect', 'buildNumberRecord(6).numClass = perfect');
      assert(r6.isPrime,     false,     'buildNumberRecord(6).isPrime = false');
      assert(r6.isEven,      true,      'buildNumberRecord(6).isEven = true');
      assert(r6.divisors,    [1,2,3,6], 'buildNumberRecord(6).divisors');

      const r7  = buildNumberRecord(7);
      assert(r7.isPrime,     true,      'buildNumberRecord(7).isPrime = true');
      assert(r7.happy.isHappy, true,    'buildNumberRecord(7) is happy');

      const r4 = buildNumberRecord(4);
      assert(happy(4).isHappy, false,   'happy(4) terminates false (unhappy)');

      const r120 = buildNumberRecord(120);
      assert(r120.roman,     'CXX',     'buildNumberRecord(120).roman = CXX');
      assert(r120.isHighlyComposite, true, 'buildNumberRecord(120).isHighlyComposite');

      const r1 = buildNumberRecord(1);
      assert(r1.isUnit,      true,      'buildNumberRecord(1).isUnit');
      assert(r1.isPrime,     false,     'buildNumberRecord(1).isPrime = false');

      assert(isPrime(2),     true,      'isPrime(2) = true (only even prime)');
      assert(isPrime(1),     false,     'isPrime(1) = false');
    })();

    // ── SEQ_GENERATORS — rule satisfaction ───────────────────────────
    section('SEQ_GENERATORS — every generator satisfies its own rule over many seeds');
    (function() {
      const TRIALS = 40;
      SEQ_GENERATORS.forEach(g => {
        let allOk = true;
        for (let t = 0; t < TRIALS; t++) {
          const seq = g.gen();
          // terms is array of 5
          if (seq.terms.length !== 5) { allOk = false; break; }
          // next is a number
          if (typeof seq.next !== 'number' || isNaN(seq.next)) { allOk = false; break; }
          // verify next is consistent: append next and check the last step matches the second-to-last step
          // For arithmetic families, d[n-1] of terms + next should equal the common difference
          // But since families vary, we just verify the generator's rule property is a non-empty string
          if (!seq.rule || typeof seq.rule !== 'string') { allOk = false; break; }
        }
        assert(allOk, true, `SEQ_GENERATORS[${g.family}] produces valid {terms,next,rule} over ${TRIALS} seeds`);
      });

      // count-up: next = terms[4] + step, step = terms[1]-terms[0]
      for (let t = 0; t < 20; t++) {
        const g = SEQ_GENERATORS.find(g => g.family === 'count');
        const seq = g.gen();
        const step = seq.terms[1] - seq.terms[0];
        assert(seq.next, seq.terms[4] + step, `count generator: next = last + step (trial ${t})`);
        break; // one representative is sufficient
      }

      // countdown: can produce negative terms (crosses zero for diff>=1)
      const cdg = SEQ_GENERATORS.find(g => g.family === 'countdown');
      let seenNeg = false;
      for (let t = 0; t < 200; t++) {
        const seq = cdg.gen();
        if (seq.next < 0) { seenNeg = true; break; }
      }
      assert(seenNeg, true, 'countdown generator can produce negative next term (crosses zero)');

      // Fibonacci family: terms[n] = terms[n-2] + terms[n-1]
      const fib = SEQ_GENERATORS.find(g => g.family === 'fibonacci');
      const seq = fib.gen();
      const fibOk = seq.terms[2] === seq.terms[0] + seq.terms[1]
                 && seq.terms[3] === seq.terms[1] + seq.terms[2]
                 && seq.terms[4] === seq.terms[2] + seq.terms[3]
                 && seq.next    === seq.terms[3] + seq.terms[4];
      assert(fibOk, true, 'fibonacci generator: each term = sum of two before (including next)');

      // Squares: each term = k^2
      const sqg = SEQ_GENERATORS.find(g => g.family === 'squares');
      let sqOk = true;
      for (let t = 0; t < 10; t++) {
        const s = sqg.gen();
        sqOk = sqOk && s.terms.every(v => isSquare(v)) && isSquare(s.next);
      }
      assert(sqOk, true, 'squares generator: all terms and next are perfect squares');
    })();

    // ── diffLadder ───────────────────────────────────────────────────
    section('diffLadder');
    (function() {
      // Arithmetic: d1 constant, d2 null
      const a = diffLadder([2, 5, 8, 11, 14]);
      assert(a.d1, [3,3,3,3], 'diffLadder arithmetic: d1 = [3,3,3,3]');
      assert(a.d2, null,      'diffLadder arithmetic: d2 = null (constant)');

      // Quadratic: d1 not constant, d2 present
      const b = diffLadder([1, 4, 9, 16, 25]);
      assert(b.d1, [3,5,7,9], 'diffLadder squares: d1 = [3,5,7,9]');
      assert(b.d2, [2,2,2],   'diffLadder squares: d2 = [2,2,2]');

      // Countdown: d1 negative and constant
      const c = diffLadder([10, 8, 6, 4, 2]);
      assert(c.d1, [-2,-2,-2,-2], 'diffLadder countdown: d1 = [-2,-2,-2,-2]');
      assert(c.d2, null,          'diffLadder countdown: d2 = null');
    })();

    // ── seqExplain (Worked Examples) ─────────────────────────────────
    section('seqExplain Worked Examples');
    (function() {
      let allFamiliesChecked = true;
      SEQ_GENERATORS.forEach(g => {
        const seq = g.gen();
        const html = seqExplain(seq);
        if (!html || typeof html !== 'string' || html.length < 50) {
          allFamiliesChecked = false;
        }
      });
      assert(allFamiliesChecked, true, 'seqExplain: valid HTML generated for all 11 sequence families');
    })();

    // ── explainProps (Math Justifications) ───────────────────────────
    section('explainProps Math Justifications');
    (function() {
      const r6 = buildNumberRecord(6);
      const html6 = explainProps(r6, 3);
      assert(html6.includes('Perfect Number'), true, 'explainProps(6): contains "Perfect Number"');
      assert(html6.includes('Even Number'), true, 'explainProps(6): contains "Even Number"');
      assert(html6.includes('Composite Number'), true, 'explainProps(6): contains "Composite Number"');
      assert(html6.includes('Digital Root'), true, 'explainProps(6): contains "Digital Root"');
      assert(html6.includes('divisible by 3'), true, 'explainProps(6): contains divisible by 3 secret');
      assert(html6.includes('never</em> be a perfect square'), true, 'explainProps(6): contains perfect square exclusion');

      const r7 = buildNumberRecord(7);
      const html7 = explainProps(r7, 3);
      assert(html7.includes('Prime Number'), true, 'explainProps(7): contains "Prime Number"');
      assert(html7.includes('Odd Number'), true, 'explainProps(7): contains "Odd Number"');
      assert(html7.includes('Digital Root'), true, 'explainProps(7): contains "Digital Root"');
      assert(html7.includes('casting out nines'), true, 'explainProps(7): contains casting out nines secret');
      assert(html7.includes('candidate, though it\'s not a perfect square'), true, 'explainProps(7): contains square candidacy');
    })();

    summarize();
  </script>
</body>
</html>
